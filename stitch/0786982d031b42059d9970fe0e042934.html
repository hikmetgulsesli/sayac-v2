<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-fixed-dim": "#c0c7d6",
              "tertiary-fixed-dim": "#ffb3ad",
              "primary-fixed-dim": "#4ae176",
              "on-background": "#dce1fb",
              "surface-tint": "#4ae176",
              "surface-container": "#191f31",
              "on-tertiary": "#68000a",
              "surface-container-low": "#151b2d",
              "on-surface": "#dce1fb",
              "background": "#0c1324",
              "on-secondary-fixed": "#151c27",
              "primary-fixed": "#6bff8f",
              "inverse-primary": "#006e2f",
              "outline": "#869585",
              "on-secondary": "#2a313d",
              "tertiary": "#ffb4ae",
              "on-tertiary-fixed-variant": "#930013",
              "on-tertiary-container": "#860011",
              "on-primary-fixed-variant": "#005321",
              "error-container": "#93000a",
              "inverse-on-surface": "#2a3043",
              "primary-container": "#22c55e",
              "on-primary-container": "#004b1e",
              "on-surface-variant": "#bccbb9",
              "surface-container-lowest": "#070d1f",
              "inverse-surface": "#dce1fb",
              "primary": "#4be277",
              "outline-variant": "#3d4a3d",
              "on-error-container": "#ffdad6",
              "on-secondary-fixed-variant": "#404754",
              "surface-container-highest": "#2e3447",
              "error": "#ffb4ab",
              "tertiary-container": "#ff8a83",
              "on-tertiary-fixed": "#410004",
              "surface": "#0c1324",
              "on-primary": "#003915",
              "tertiary-fixed": "#ffdad7",
              "surface-variant": "#2e3447"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "0px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tactical-glow {
            box-shadow: inset 0 0 10px rgba(75, 226, 119, 0.15);
        }
        .status-bar {
            height: 4px;
            background: linear-gradient(90deg, #4be277, #22c55e);
        }
        .scanline {
            background: linear-gradient(to bottom, rgba(12, 19, 36, 0) 0%, rgba(75, 226, 119, 0.05) 50%, rgba(12, 19, 36, 0) 100%);
            height: 2px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation Anchor -->
<header class="bg-slate-950 flex justify-between items-center w-full px-6 py-4 border-b-0">
<div class="text-xl font-black tracking-tighter text-emerald-500 font-headline">SAYAC_V2</div>
<div class="flex items-center gap-6">
<span class="font-label uppercase tracking-widest text-[10px] text-emerald-500">SİSTEM ÇALIŞIYOR</span>
<div class="flex gap-4">
<button class="text-slate-500 hover:bg-slate-800 transition-colors p-2"><span class="material-symbols-outlined" data-icon="history">history</span></button>
<button class="text-slate-500 hover:bg-slate-800 transition-colors p-2"><span class="material-symbols-outlined" data-icon="settings">settings</span></button>
</div>
</div>
</header>
<!-- Tactical HUD Main Canvas -->
<main class="flex-grow flex items-center justify-center relative px-4">
<!-- Status Bar Primitive -->
<div class="absolute top-0 left-0 w-full status-bar"></div>
<!-- Background Decorative Elements -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-10 left-10 border-l border-t border-primary w-12 h-12"></div>
<div class="absolute top-10 right-10 border-r border-t border-primary w-12 h-12"></div>
<div class="absolute bottom-10 left-10 border-l border-b border-primary w-12 h-12"></div>
<div class="absolute bottom-10 right-10 border-r border-b border-primary w-12 h-12"></div>
</div>
<!-- Main Empty State Container -->
<div class="w-full max-w-xl text-center flex flex-col items-center">
<!-- Metadata Readout -->
<div class="mb-12 flex items-center gap-4">
<div class="bg-surface-container-highest px-3 py-1 flex items-center">
<span class="font-label text-[10px] uppercase tracking-widest text-primary">DURUM: HAZIR</span>
</div>
<div class="h-[1px] w-12 bg-outline-variant opacity-30"></div>
<div class="bg-surface-container-lowest px-3 py-1 flex items-center">
<span class="font-label text-[10px] uppercase tracking-widest text-secondary-fixed-dim">OTURUM_01</span>
</div>
</div>
<!-- Central Data Metric -->
<div class="relative group">
<h1 class="font-headline text-[12rem] md:text-[16rem] font-bold leading-none tracking-tighter text-on-surface flex items-baseline">
                    0
                </h1>
<div class="absolute -top-4 -right-8 opacity-40">
<span class="font-label text-[12px] uppercase tracking-[0.2em] text-primary rotate-90 origin-left">PR_V2</span>
</div>
</div>
<!-- Contextual Label -->
<div class="mt-4 mb-16">
<p class="font-label text-sm uppercase tracking-[0.4em] text-primary font-bold">BAŞLANGIÇ NOKTASI</p>
<div class="flex justify-center mt-4">
<div class="h-1 w-2 bg-primary"></div>
<div class="h-1 w-8 bg-surface-container mx-1"></div>
<div class="h-1 w-2 bg-primary"></div>
</div>
</div>
<!-- Tactical Triggers Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-0 w-full max-w-lg">
<!-- Azalt (Disabled) -->
<button class="bg-surface-container-lowest text-slate-600 font-label uppercase tracking-widest text-xs py-8 flex flex-col items-center justify-center opacity-40 cursor-not-allowed border-r border-slate-900/50">
<span class="material-symbols-outlined mb-3 text-2xl" data-icon="remove">remove</span>
                    Azalt
                </button>
<!-- Artır (Active) -->
<button class="bg-primary-container text-on-primary-container font-label uppercase tracking-widest text-xs py-8 flex flex-col items-center justify-center tactical-glow active:opacity-80 transition-all">
<span class="material-symbols-outlined mb-3 text-2xl font-bold" data-icon="add">add</span>
                    Artır
                </button>
<!-- Sıfırla (Secondary Action) -->
<button class="bg-surface-container text-secondary font-label uppercase tracking-widest text-xs py-8 flex flex-col items-center justify-center hover:bg-surface-container-highest transition-colors active:opacity-80 border-l border-slate-900/50">
<span class="material-symbols-outlined mb-3 text-2xl" data-icon="refresh">refresh</span>
                    Sıfırla
                </button>
</div>
<!-- Footer HUD Info -->
<div class="mt-12 flex items-center justify-between w-full max-w-lg px-2">
<div class="flex flex-col items-start">
<span class="font-label text-[9px] text-slate-600">SİSTEM_GİRİŞİ</span>
<span class="font-headline text-xs text-on-surface">LOC_TR_EST</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label text-[9px] text-slate-600">VERİ_AKIŞI</span>
<span class="font-headline text-xs text-primary">AKTİF</span>
</div>
</div>
</div>
</main>
<!-- System Footer -->
<footer class="fixed bottom-0 w-full flex justify-center items-center py-2 px-4 bg-slate-950 border-t border-slate-900">
<div class="font-['Inter'] uppercase tracking-[0.1em] text-[9px] font-bold text-slate-600">
            SISTEM_AKTIF | BUILD_v2.4.0-STABLE
        </div>
</footer>
</body></html>
