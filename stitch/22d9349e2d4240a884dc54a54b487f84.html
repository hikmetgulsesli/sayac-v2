    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .tactical-glow:hover {
      box-shadow: 0 0 12px 2px rgba(34, 197, 94, 0.2);
    }
    .error-glow {
      box-shadow: inset 0 0 20px rgba(147, 0, 10, 0.15);

<header class="bg-slate-950 text-emerald-500 flex justify-between items-center w-full px-6 py-4 fixed top-0 z-50">
<div class="text-xl font-black tracking-tighter text-emerald-500 font-headline">
      SAYAC_V2

<div class="flex gap-4">
<button class="text-slate-500 hover:bg-slate-800 transition-colors p-2 active:opacity-80">

</button>
<button class="text-slate-500 hover:bg-slate-800 transition-colors p-2 active:opacity-80">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>

<div class="w-full max-w-xl bg-surface-container relative overflow-hidden error-glow">

</div>
</div>
<h1 class="font-headline text-3xl md:text-4xl font-bold tracking-tighter text-tertiary mb-6 uppercase">

        </h1>
<p class="text-on-surface-variant text-base md:text-lg leading-relaxed mb-10 max-w-md">

        </p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mb-10 text-left bg-surface-container-lowest p-6">
<div class="flex flex-col gap-1">
<span class="font-label text-[10px] tracking-widest text-slate-500 uppercase">Module ID</span>
<span class="font-headline text-lg font-medium text-on-surface">SYS_STORAGE_01</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-label text-[10px] tracking-widest text-slate-500 uppercase">Protocol Status</span>
<span class="font-headline text-lg font-medium text-tertiary">DISABLED</span>
</div>
</div>
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-primary-container text-on-primary-container font-headline font-bold py-4 tracking-tight tactical-glow transition-all active:opacity-80">
            SAYFAYI YENİLE
          </button>
<button class="w-full bg-transparent text-on-surface font-label text-[11px] tracking-[0.2em] uppercase py-3 border border-outline-variant hover:bg-surface-container-highest transition-colors">
            DESTEK KAYDI OLUŞTUR
          </button>
</div>
</div>
<div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
<span class="material-symbols-outlined text-9xl" data-icon="lock">lock</span>
</div>
</div>
</main>
<footer class="fixed bottom-0 w-full flex justify-center items-center py-2 px-4 bg-slate-950 border-t border-slate-900 z-50">
<div class="font-['Inter'] uppercase tracking-[0.1em] text-[9px] font-bold text-slate-600">
